[package]
name = "agx"
version = "0.1.0"
edition = "2024"
description = "A package manager for AI agent environments"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
semver = { version = "1", features = ["serde"] }
sha2 = "0.10"
dirs = "6"
dialoguer = "0.11"
indicatif = "0.17"
console = "0.15"
tempfile = "3"
walkdir = "2"
thiserror = "2"
anyhow = "1"
clap_complete = "4"
